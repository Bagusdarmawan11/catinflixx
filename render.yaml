services:
  - type: web
    name: catinflix
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Isi di Render Dashboard — jangan hardcode di sini:
      # DATABASE_URL       → Neon connection string (pooler)
      # JWT_SECRET         → openssl rand -hex 32
      # TMDB_API_TOKEN     → Bearer token dari themoviedb.org
      # NEXT_PUBLIC_APP_URL       → https://catinflixx.onrender.com
      # NEXT_PUBLIC_SOCKET_URL    → https://catinflixx.onrender.com
