services:
  - type: web
    name: catinflix
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Variabel berikut diisi manual di Render Dashboard (bukan di sini):
      # DATABASE_URL
      # JWT_SECRET
      # TMDB_API_TOKEN
      # NEXT_PUBLIC_APP_URL
      # NEXT_PUBLIC_SOCKET_URL
